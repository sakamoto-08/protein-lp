<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パーソナルプロテイン診断｜あなたに最適なプロテインを提案</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- 1.ヘッダーエリア -->
    <header class="l-header">
        <div class="l-header__inner">
            <h1 class="l-header__logo">Protein Select</h1>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="l-main">

        <!-- 2.ファーストビュー（ヒーローセクション） -->
        <section class="p-hero" id="hero">
            <h2>自分にぴったりのプロテインが見つかる</h2>
        </section>

        <!-- 3.ブランドコンセプト・強み -->
        <section class="p-concept" id="concept">
            <h2>選ばれる理由</h2>
        </section>

        <!-- 4.メイン：パーソナル診断エリア -->
        <section class="p-diagnosis" id="diagnosis">
            <h2>パーソナルプロテイン診断</h2>
            <!-- ここにJavaScriptで診断カードを動的に流し込みます -->
            <div class="p-diagnosis__inner js-diagnosis-container"></div>
        </section>

        <!-- 5.比較・シミュレーターエリア -->
        <section class="p-simulator" id="simulator">
            <h2>プロテイン比較・シミュレーター</h2>
        </section>

        <!-- 6.申し込みフォーム -->
        <section class="p-contact" id="contact">
            <h2>ご購入・お申込み</h2>
        </section>

    </main>

    <!-- 7.フッターエリア -->
    <footer class="l-footer">
        <p class="l-footer__copyright">&copy; 2026 Protein Select All Rights Reserved.</p>
    </footer>
</body>

</html>
